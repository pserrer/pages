<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy — Inboki</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1a1c24; --muted: #5a5f6e; --card: #f4f5f8;
      --accent: #2f6fed; --border: #e2e5ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117; --fg: #e6e8ee; --muted: #9aa0b0; --card: #171a22;
        --accent: #6ea0ff; --border: #262a35;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65; -webkit-text-size-adjust: 100%;
    }
    main { max-width: 720px; margin: 0 auto; padding: 40px 20px 72px; }
    h1 { font-size: 1.9rem; margin: 0 0 4px; }
    p { color: var(--fg); }
    .muted { color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px; margin: 22px 0;
    }
    footer {
      margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Privacy Policy</h1>
    <p class="muted">Inboki</p>

    <div class="card">
      This page will explain how Inboki handles information. More details will
      be added as the app’s privacy practices are finalized.
    </div>

    <footer>
      This page applies to Inboki.
    </footer>
  </main>
</body>
</html>
